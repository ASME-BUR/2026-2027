; bur_mcu: Arduino Due firmware (F-1 gait, F-3 watchdog, F-5 IMU).
; See README.md. Build from this directory: `pio run`, `pio test -e native`.

[platformio]
default_envs = due

[env:due]
platform = atmelsam
board = dueUSB                      ; Native USB port carries micro-ROS
framework = arduino
board_microros_distro = jazzy       ; must match the agent on the Pi
board_microros_transport = serial
lib_deps =
    ; pinned: the commit verified to build for the Due with jazzy (2026-11-07)
    https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1
    arduino-libraries/Servo@1.2.1
; ASME-BUR fork of the SAM core. Its one change raises the Wire buffer from
; 32 to 256 bytes so a whole MTi measurement packet fits in one read.
platform_packages =
    framework-arduino-sam@https://github.com/ASME-BUR/ArduinoCore-sam.git
; gait.hpp is shared with the Pi (src/gnc/bur_gait), not copied, so the RViz
; preview and the vehicle cannot drift apart. It needs C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../../src/gnc/bur_gait/include
; Copies the vendored bur_msgs into extra_packages/ before micro-ROS builds.
extra_scripts = pre:scripts/sync_bur_msgs.py

; Host unit tests for the chain logic (gait tick, watchdog, servo mapping).
; No Arduino, no micro-ROS, no hardware: `pio test -e native`.
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -Iinclude
    -I../../src/gnc/bur_gait/include
test_build_src = no
lib_ignore = Xsens_MTi_I2C
